name: Lint and Format Markdown

on:
  push:
    branches: [staging, production]
  pull_request:
    branches: [staging, production]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: tj-actions/changed-files@v46
      id: changed-files
      with:
        files: |
          **/*.md
          !nexus-next/**/*.md
          !nexus-sdk/**/*.md
    - uses: DavidAnson/markdownlint-cli2-action@v20
      if: steps.changed-files.outputs.any_changed == 'true'
      with:
        globs: ${{ steps.changed-files.outputs.all_changed_files }}
        config: .markdownlint.json
        fix: true

    - uses: crazy-max/ghaction-import-gpg@v6
      if: steps.changed-files.outputs.any_changed == 'true'
      with:
        gpg_private_key: ${{ secrets.DEVOPS_GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.DEVOPS_GPG_PASSPHRASE }}
        git_user_signingkey: true
        git_commit_gpgsign: true
        git_config_global: true
        
    - name: Commit changes
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        git config user.name "devops-talus"
        git config user.email "devops@taluslabs.xyz"
        git add -A
        git diff --quiet && git diff --staged --quiet || (git commit -S -m "style: format markdown files" && git push)