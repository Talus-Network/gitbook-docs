name: Format Markdown Links

on:
  push:
    branches: [staging, production]
    paths:
        - 'nexus-next/**'
        - 'nexus-sdk/**'

permissions:
  contents: write

jobs:
  markdown-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Format links in markdown files
        run: |
          python .github/scripts/convert_markdown_links.py nexus-next nexus-sdk

      - uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.DEVOPS_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.DEVOPS_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true

      - name: Commit changes
        run: |
          git config user.name "devops-talus"
          git config user.email "devops@taluslabs.xyz"
          git add nexus-next nexus-sdk
          git diff --quiet && git diff --staged --quiet || (git commit -S -m "chore: format markdown links" && git push)
