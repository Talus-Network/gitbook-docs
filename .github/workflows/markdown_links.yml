name: Format Markdown Links

on:
  push:
    branches: [staging, production]
    paths:
        - 'nexus-next/**'
        - 'nexus-sdk/**'

permissions:
  contents: write

jobs:
  markdown-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install remark and plugins
        run: |
          npm install -g remark-cli remark-inline-links

      - name: Format links in markdown files
        run: remark nexus-next nexus-sdk --use remark-inline-links --output

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add nexus-next nexus-sdk
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: format markdown with remark-inline-links"
          git push
